name: Validate themes
on:
  push:
  pull_request:
jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - name: Check every theme against the schema
        run: |
          npm install --no-save ajv-cli@5.0.0 ajv-formats@3.0.1
          files=()
          for file in ./*.json; do
            [ "$(basename "$file")" = index.json ] && continue
            files+=("$file")
          done
          npx ajv validate --spec=draft2020 -c ajv-formats -s schema/kanso-theme-v1.json \
            -d "{$(IFS=,; echo "${files[*]}")}" --all-errors
      - name: Check every icon theme against its schema
        run: |
          for dir in icon-themes/*/; do
            name=$(basename "$dir")
            [ "$name" = schema ] && continue
            npx ajv validate --spec=draft2020 -c ajv-formats -s icon-themes/schema/kanso-icon-theme-v1.json -d "$dir$name.json" --all-errors
          done
      - name: Test and check the gallery builder
        # Validate what the builder makes now, not the committed gallery/:
        # a theme edit must not need a publish before it can pass checks.
        run: |
          node --test scripts/gallery.test.mjs
          node scripts/gallery.mjs --root . --out /tmp/gallery-check
          node scripts/gallery.mjs --root . --out /tmp/gallery-check --check
      - name: Test the signer
        run: cargo test --locked --manifest-path tools/gallery-sign/Cargo.toml

  kanso:
    # Schema checks cannot see Kanso's own parser, contrast checks or icon
    # path rules, so this runs the pinned Kanso parsers on the same tree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Read the Kanso commit the parser comes from
        id: kanso
        run: echo "sha=$(cat gallery/kanso-commit.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: iamngoni/kanso
          ref: ${{ steps.kanso.outputs.sha }}
          path: kanso
          submodules: recursive
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - name: Linux build dependencies
        run: bash kanso/scripts/linux-deps.sh
      - name: Build Kanso's parsers
        run: cargo build --locked -p kanso-app --manifest-path kanso/Cargo.toml
      - name: Check every theme with Kanso's own parser and contrast checks
        env:
          KANSO_DATA_DIR: /tmp/kanso-themes-check
        run: |
          kanso=kanso/target/debug/kanso
          mapfile -t themes < <(find . -maxdepth 1 -name '*.json' ! -name index.json | sort)
          "$kanso" theme check "${themes[@]}"
          for dir in icon-themes/*/; do
            name=$(basename "$dir")
            [ "$name" = schema ] && continue
            "$kanso" icon-theme check "$dir"
          done
      - name: Check the generated index with Kanso's gallery parser
        # The pinned commit predates kanso-gallery; this starts checking the
        # real builder output as soon as gallery/kanso-commit.txt points at a
        # Kanso commit that has it (after the gallery PRs merge).
        run: |
          node scripts/gallery.mjs --root . --out /tmp/gallery-check
          if [ -f kanso/crates/kanso-gallery/examples/gallery-check.rs ]; then
            cargo run --locked -p kanso-gallery --manifest-path kanso/Cargo.toml \
              --example gallery-check -- \
              --index /tmp/gallery-check/index.json \
              --root . --out /tmp/gallery-check
          else
            echo "Kanso at $(cat gallery/kanso-commit.txt) has no gallery parser yet; skipping."
          fi
